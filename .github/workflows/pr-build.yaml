name: PR Build and Push

on:
  pull_request:
    branches:
      - main
    paths:
      - "kustomize-mutating-webhook/**/*.go"
      - "kustomize-mutating-webhook/go.mod"
      - "kustomize-mutating-webhook/go.sum"
      - "Dockerfile"
      - ".github/workflows/pr-build.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run tests
        working-directory: kustomize-mutating-webhook
        run: go test -v ./...

  build-and-push-pr-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          install: true
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push PR Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=kustomize-mutating-webhook
            org.opencontainers.image.description=PR build for #${{ github.event.pull_request.number }}
            org.opencontainers.image.source=${{ github.event.pull_request.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Docker Image Built

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🐳 Docker Image Built Successfully

            **PR Image:**
            ```
            ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }}
            ```

            **SHA-specific Image:**
            ```
            ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            ```

            **Image Digest:**
            ```
            ${{ steps.build.outputs.digest }}
            ```

            **Platforms:** `linux/amd64`

            ---

            ### 🚀 How to Test

            **Using Helm:**
            ```bash
            helm upgrade --install kustomize-mutating-webhook \
              oci://ghcr.io/${{ github.repository_owner }}/charts/kustomize-mutating-webhook \
              --namespace flux-system \
              --set image.repository=ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook \
              --set image.tag=pr-${{ github.event.pull_request.number }}
            ```

            **Using kubectl:**
            ```bash
            kubectl set image deployment/kustomize-mutating-webhook \
              kustomize-mutating-webhook=ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }} \
              -n flux-system
            ```

            **Pull the image:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook:pr-${{ github.event.pull_request.number }}
            ```

            <sub>Built from commit ${{ github.sha }}</sub>
