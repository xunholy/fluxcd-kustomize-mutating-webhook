name: Publish Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CHART_PATH: ./deploy/chart/kustomize-mutating-webhook
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    # Only run on helm-chart releases or manual trigger
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.tag_name, 'chart-v')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Chart Version
        id: chart-version
        run: |
          version=$(helm show chart ${{ env.CHART_PATH }} | grep '^version:' | awk '{print $2}')
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Package Chart
        run: helm package ${{ env.CHART_PATH }}

      - name: Push OCI Chart
        run: |
          helm push kustomize-mutating-webhook-${{ steps.chart-version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}/charts

      - name: Sign OCI Chart with Cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/charts/kustomize-mutating-webhook:${{ steps.chart-version.outputs.version }}

      - name: Configure Git for chart-releaser
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          install_only: true

      - name: Upload chart to GitHub release
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_OWNER: "${{ github.repository_owner }}"
          CR_GIT_REPO: "${{ github.event.repository.name }}"
        run: |
          mkdir -p .cr-release-packages
          cp kustomize-mutating-webhook-*.tgz .cr-release-packages/
          cr upload --owner "$CR_OWNER" --git-repo "$CR_GIT_REPO" --skip-existing

      - name: Update Helm repo index on gh-pages
        env:
          CHART_VERSION: "${{ steps.chart-version.outputs.version }}"
          CR_OWNER: "${{ github.repository_owner }}"
          CR_GIT_REPO: "${{ github.event.repository.name }}"
        run: |
          chart_name="kustomize-mutating-webhook"
          release_url="https://github.com/${CR_OWNER}/${CR_GIT_REPO}/releases/download/${chart_name}-${CHART_VERSION}"

          # Checkout gh-pages into a working directory
          git fetch origin gh-pages
          git worktree add gh-pages-dir origin/gh-pages

          # Merge new chart entry into the existing index
          helm repo index .cr-release-packages --url "$release_url" --merge gh-pages-dir/index.yaml
          cp .cr-release-packages/index.yaml gh-pages-dir/index.yaml

          # Commit and push
          cd gh-pages-dir
          git add index.yaml
          git commit -m "Update index.yaml with ${chart_name}-${CHART_VERSION}"
          git push origin HEAD:gh-pages
