name: Publish Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CHART_PATH: ./deploy/chart/fluxcd-mutating-webhook
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    # Only run on helm-chart releases or manual trigger
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'helm-chart-v')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Chart Version
        id: chart-version
        run: |
          version=$(helm show chart ${{ env.CHART_PATH }} | grep '^version:' | awk '{print $2}')
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Package Chart
        run: helm package ${{ env.CHART_PATH }}

      - name: Push OCI Chart
        run: |
          helm push kustomize-mutating-webhook-${{ steps.chart-version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}/charts

      - name: Sign Chart with Cosign
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/charts/kustomize-mutating-webhook:${{ steps.chart-version.outputs.version }}
