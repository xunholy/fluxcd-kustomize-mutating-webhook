name: Build, Test, and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (leave empty to use latest release tag)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "kustomize-mutating-webhook/**/*.go"
      - "kustomize-mutating-webhook/go.mod"
      - "kustomize-mutating-webhook/go.sum"
      - "Dockerfile"
      - ".github/workflows/build-docker.yaml"
    tags:
      - "v*.*.*"
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run tests
        working-directory: kustomize-mutating-webhook
        run: go test -v ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Skip if this is a chart-only release
    if: |
      always() && needs.test.result == 'success' &&
      (github.event_name != 'release' || !contains(github.event.release.tag_name, 'chart-v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get tag to build
        id: get-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" == "release" ]; then
            # Extract semver from tag (e.g., kustomize-mutating-webhook-v0.11.0 -> v0.11.0)
            tag=$(echo "$RELEASE_TAG" | grep -oP 'v\d+\.\d+\.\d+')
            echo "tag=$tag" >> $GITHUB_OUTPUT
          else
            # Get latest app release tag (exclude chart-only releases)
            latest_tag=$(gh release list --limit 100 --json tagName -q '.[] | select(.tagName | test("^kustomize-mutating-webhook-v")) | select(.tagName | test("chart") | not) | .tagName' | head -n1 2>/dev/null || echo "")
            if [ -n "$latest_tag" ]; then
              tag=$(echo "$latest_tag" | grep -oP 'v\d+\.\d+\.\d+')
              echo "tag=$tag" >> $GITHUB_OUTPUT
            else
              echo "tag=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout at tag
        if: steps.get-tag.outputs.tag != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || format('kustomize-mutating-webhook-{0}', steps.get-tag.outputs.tag) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3
        with:
          install: true
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook
          tags: |
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}},value=${{ steps.get-tag.outputs.tag }},enable=${{ steps.get-tag.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get-tag.outputs.tag }},enable=${{ steps.get-tag.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.get-tag.outputs.tag }},enable=${{ steps.get-tag.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign container image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/kustomize-mutating-webhook@${{ steps.build.outputs.digest }}
