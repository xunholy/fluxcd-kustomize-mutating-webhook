name: Generate Helm Chart Documentation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "deploy/chart/**"

permissions:
  contents: read
  pull-requests: write

env:
  CHART_PATH: ./deploy/chart/fluxcd-mutating-webhook

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Helm Docs
        run: |
          curl -L https://github.com/norwoodj/helm-docs/releases/download/v1.11.0/helm-docs_1.11.0_Linux_x86_64.tar.gz | tar xz
          sudo mv helm-docs /usr/local/bin/helm-docs

      - name: Generate README
        run: |
          cd ${{ env.CHART_PATH }}
          helm-docs

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code ${{ env.CHART_PATH }}/README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Comment on PR if docs need updating
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Helm chart documentation is out of date. Please run `helm-docs` in `deploy/chart/fluxcd-mutating-webhook/` and commit the changes.'
            })

      - name: Fail if docs are out of date
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "ERROR: Helm chart README is out of date"
          echo "Please run: cd deploy/chart/fluxcd-mutating-webhook && helm-docs"
          exit 1
