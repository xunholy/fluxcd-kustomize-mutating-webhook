name: Generate Helm Chart Documentation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "deploy/chart/**"
  push:
    branches: ["main"]
    paths:
      - "deploy/chart/**"

permissions:
  contents: write
  pull-requests: write

env:
  CHART_PATH: ./deploy/chart/kustomize-mutating-webhook

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm Docs
        run: |
          curl -L https://github.com/norwoodj/helm-docs/releases/download/v1.11.0/helm-docs_1.11.0_Linux_x86_64.tar.gz | tar xz
          sudo mv helm-docs /usr/local/bin/helm-docs

      - name: Generate README
        run: |
          cd ${{ env.CHART_PATH }}
          helm-docs

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code ${{ env.CHART_PATH }}/README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push generated documentation
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHART_PATH }}/README.md
          git commit -m "docs: update Helm chart documentation [skip ci]"
          git push
